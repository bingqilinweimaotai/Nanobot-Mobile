name: android

on:
  push:
    paths:
      - "app/**"
      - "gateway/**"
      - "protocol/**"
      - "tunnel/**"
      - "**/*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "gateway/**"
      - "protocol/**"
      - "tunnel/**"
      - "**/*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android.yml"

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  test:
    name: Kotlin unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The default "tools platform-tools" no longer resolves: the legacy
          # "tools" package was removed from the SDK repository.
          packages: "platform-tools"

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew :protocol:test :tunnel:test :gateway:test :app:testDebugUnitTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            gateway/build/reports/tests/
            protocol/build/reports/tests/
            tunnel/build/reports/tests/
          if-no-files-found: ignore
