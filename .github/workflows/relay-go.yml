name: relay-go

on:
  push:
    paths:
      - "relay-go/**"
      - ".github/workflows/relay-go.yml"
  pull_request:
    paths:
      - "relay-go/**"
      - ".github/workflows/relay-go.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: relay-go/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race ./...

      - name: Build static binaries
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/nanobot-relay ./cmd/relay
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/nanobot-link ./cmd/link

      - name: Cross-compile nanobot-link
        run: |
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" -o /tmp/nanobot-link-test ./cmd/link
          done
