name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  # Baked into nanobot-link so users can run the binary without --relay. Set it under
  # Settings > Secrets and variables > Actions; the address is never committed.
  DEFAULT_RELAY: ${{ vars.DEFAULT_RELAY }}

jobs:
  android:
    name: Android APK and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The default "tools platform-tools" no longer resolves: the legacy
          # "tools" package was removed from the SDK repository.
          packages: "platform-tools"

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          chmod +x gradlew
          version_args=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            core="${version%%-*}"
            major="${core%%.*}"
            rest="${core#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            [[ "$patch" == "$rest" ]] && patch=0
            code=$((10#${major:-0} * 10000 + 10#${minor:-0} * 100 + 10#${patch:-0}))
            version_args="-PappVersionName=$version -PappVersionCode=$code"
          fi
          ./gradlew :gateway:test :protocol:test :tunnel:test \
            :app:testDebugUnitTest :app:assembleDebug $version_args

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  link:
    name: nanobot-link (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: relay-go/go.sum

      - name: Require the built-in relay
        run: |
          if [ -z "${DEFAULT_RELAY}" ]; then
            echo "::error::DEFAULT_RELAY is not set; add it under Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Build
        working-directory: relay-go
        run: |
          name="bin/nanobot-link-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then name="$name.exe"; fi
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w -X main.defaultRelayURL=${DEFAULT_RELAY}" -o "$name" ./cmd/link

      - uses: actions/upload-artifact@v4
        with:
          name: link-${{ matrix.goos }}-${{ matrix.goarch }}
          path: relay-go/bin/*
          if-no-files-found: error

  relay:
    name: Relay binaries and container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: relay-go/go.sum

      - name: Test
        working-directory: relay-go
        run: go test ./...

      - name: Build static binaries
        working-directory: relay-go
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o bin/nanobot-relay-linux-amd64 ./cmd/relay
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" \
            -o bin/nanobot-relay-linux-arm64 ./cmd/relay

      - uses: actions/upload-artifact@v4
        with:
          name: relay-binaries
          path: relay-go/bin/*
          if-no-files-found: error

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push relay image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-relay"
          docker build -f relay-go/Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "$image:${GITHUB_REF_NAME}" -t "$image:latest" relay-go
          docker push "$image:${GITHUB_REF_NAME}"
          docker push "$image:latest"

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, link, relay]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p dist
          find artifacts -type f -not -name '*.apk' -exec cp {} dist/ \;
          cp artifacts/android-apk/app-debug.apk "dist/Nanobot-Mobile-${GITHUB_REF_NAME}.apk"
          chmod +x dist/nanobot-link-* dist/nanobot-relay-* 2>/dev/null || true
          ls -lh dist

      - name: Compose release notes
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-relay"
          {
            echo "## Download"
            echo
            echo "- **Phone**: \`Nanobot-Mobile-${GITHUB_REF_NAME}.apk\`"
            echo "- **PC program**: \`nanobot-link-windows-amd64.exe\`, \`nanobot-link-linux-*\`,"
            echo "  or \`nanobot-link-darwin-*\`. A single static binary; no runtime needed."
            echo "- **Self-hosted relay**: \`nanobot-relay-linux-amd64\`, \`nanobot-relay-linux-arm64\`,"
            echo "  or \`${image}:${GITHUB_REF_NAME}\`."
            echo
            echo "Run \`nanobot-link\` on the PC that hosts nanobot and scan the QR code with the"
            echo "app. It already points at the built-in relay; pass \`--relay"
            echo "wss://your-relay.example.com/nanobot\` only if you use a self-hosted relay. The"
            echo "pairing link and QR contain the key to your PC — treat them like passwords."
          } > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
